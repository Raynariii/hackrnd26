name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B verify
      - name: Failed tests as annotations
        if: failure()
        working-directory: backend
        run: |
          # провалившиеся тесты видно в PR без открытия лога: первая строка причины каждого
          for f in $(grep -l -E "FAILURE|ERROR" */target/surefire-reports/*.txt 2>/dev/null); do
            grep -A3 -E "<<< (FAILURE|ERROR)" "$f" | tr '\n' ' ' | cut -c1-2500 | sed 's/^/::error title=Тест упал::/'
            echo
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1.25.11 lint --extends minimal contracts/openapi.yaml

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Smoke test (web → api → runner)
        run: python3 .github/scripts/compose-smoke.py
      - name: Jury path via UI (browser → web → api → runner)
        working-directory: frontend
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          JURY_URL=http://localhost:3000 node e2e/jury.mjs e2e-out
      - name: Jury screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jury-e2e
          path: frontend/e2e-out
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
